[project]
name = "firsthand"
version = "0.1.0"
description = "An open-source, self-hosted agent that catches duplicate and related feature requests before they're filed twice."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.2",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "cryptography>=50.0",  # CVE-2026-69247, CVE-2026-69249 (Bleichenbacher oracle, path-building DoS)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
    "ruff>=0.8",
    "mypy>=1.13",
]
# The NER layer of redaction.py (design doc §1, §8.1). Not in `dev`: it pulls
# in spaCy and a language model, which the fast lint/unit jobs don't need —
# redaction degrades to its pattern-only pass without this installed (§7).
# The runtime image always installs it; see the Dockerfile.
pii = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "setuptools>=78.1.1",  # CVE-2025-47273 (path traversal) — transitive; pinned to force the fix
    "msgpack>=1.2.1",  # GHSA-6v7p-g79w-8964 (OOB read on Unpacker reuse) — transitive via spaCy's srsly
]

[project.urls]
Homepage = "https://github.com/wangxu1989911/firsthand"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firsthand"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import the shared fakes as `tests.fakes` under the `pytest` script too.
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: exercises the real Postgres/Redis containers; skipped when they are not reachable",
    "e2e: drives the app through a real browser; skipped when Playwright/a browser is unavailable",
    "presidio: exercises the real Presidio/spaCy NER model; skipped when the 'pii' extra isn't installed",
]
addopts = "-q"

[tool.coverage.run]
source = ["src/firsthand"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.mypy]
python_version = "3.14"
packages = ["firsthand"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

# The `pii` extra (presidio + spacy) is intentionally not a `dev` dependency
# (see pyproject.toml's `pii` group and redaction.py) — mypy runs without it
# installed, so it has no stubs to check these imports against.
[[tool.mypy.overrides]]
module = ["presidio_analyzer.*", "presidio_anonymizer.*"]
ignore_missing_imports = true
