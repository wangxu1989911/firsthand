<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Firsthand — file a request</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="chat">
    <h1>File a feature request</h1>
    <p class="lede">
      Tell us what you need. We'll ask a couple of follow-up questions, then check
      whether it's already been raised.
    </p>
    <ol id="transcript" class="transcript" aria-live="polite">
      {% for entry in transcript %}
      <li class="turn turn--{{ entry.role }}">
        <span class="turn__role">{{ entry.role }}</span>
        <span class="turn__text">{{ entry.text }}</span>
      </li>
      {% endfor %}
    </ol>
    <form id="chat-form" class="composer" autocomplete="off">
      <label class="visually-hidden" for="message">Your message</label>
      <input id="message" name="message" type="text" placeholder="Describe your request…"
             required {% if done %}disabled{% endif %} />
      <button type="submit" {% if done %}disabled{% endif %}>Send</button>
    </form>
    <p id="status" class="status" role="status">{% if done %}This conversation is complete.{% endif %}</p>
  </main>
  <script src="/static/chat.js"></script>
</body>
</html>
