{% extends "_base.html" %}
{% block title %}Change password — Firsthand admin{% endblock %}
{% block body %}
<h1>Change password</h1>
{% if must_change %}
<p>Your account still uses its bootstrap password. Choose a new one to continue.</p>
{% endif %}
<form method="post" action="/admin/password">
  <label for="current">Current password</label>
  <input id="current" name="current_password" type="password" required />
  <label for="new">New password</label>
  <input id="new" name="new_password" type="password" required minlength="12" />
  <label for="confirm">Confirm new password</label>
  <input id="confirm" name="confirm_password" type="password" required minlength="12" />
  <p><button type="submit">Update password</button></p>
</form>
{% endblock %}
