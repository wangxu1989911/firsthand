# Dev-container overlay: same stack as docker-compose.yml (§8.2), with the
# worktree bind-mounted so edits are live and the app container kept idle so
# VS Code — not the CMD — decides when the service runs.
#
# The mount source is "." and not "..": Compose resolves relative paths against
# the *project* directory — the directory of the first -f file, i.e. the repo
# root — not against the file they appear in. ".." mounted the repo's parent,
# so /workspace had no pyproject.toml and postCreateCommand failed.
services:
  app:
    # The dev stage from the root Dockerfile — same base as production, plus git
    # and the dev dependencies. Production builds still get the default
    # (`runtime`) stage, so none of this reaches the deployed image.
    build:
      context: .
      target: dev
    volumes:
      - .:/workspace:cached
    working_dir: /workspace
    command: ["sleep", "infinity"]
    environment:
      PYTHONPATH: /workspace/src
